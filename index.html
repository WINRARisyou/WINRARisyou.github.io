<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>WinRAR OS</title>
		<link rel="stylesheet" href="files/css/style.css">
		<link rel="shortcut icon" href="files/img/icon new.svg" type="image/x-icon">
		<!-- Get fonts for systems that don't have them installed-->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="manifest" href="manifest.json">
		<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
		<script defer src="https://cdn.jsdelivr.net/npm/eruda"></script>
		<script src="files/script/register-sw.js"></script>
	</head>

	<body>
		<div id="notifications">
			<div style="flex-grow: 1; min-height: 70px;"></div>
			<!-- Will be filled in dynamically-->
		</div>
		<div id="startMenu" class="startMenuClosed">
			<!-- Will also be filled in dynamically-->
		</div>
		<div id="openWindows">
			<!-- Will ALSO be filled in dynamically-->
		</div>
		<div id="taskbar">
			<img id="taskbar-new-app" src="files/img/add app.svg" />
			<a id="actual-taskbar-button" href="javascript:void(0);" onclick="createCustomWindow()"></a>
			<div id="taskbar-content">
				<!-- You get it by this point -->
			</div>
		</div>
		<script src="files/script/UI.js"></script>
		<script src="files/script/windows.js"></script>
		<script src="files/script/main.js"></script>
	</body>
</html>
